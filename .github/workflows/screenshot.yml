name: Telegram Commit Notification

on:
  push:
    branches:
      - main  # or master, depending on your default branch

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for commit log

      - name: Prepare commit log
        id: commit_log
        run: |
          # Get the range of commits in this push
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Initial push
            COMMIT_RANGE="HEAD"
            COMMIT_MESSAGE="✨ Initial commit"
          else
            COMMIT_RANGE="${{ github.event.before }}..${{ github.event.after }}"
          fi
          
          # Get commit details
          echo "COMMITTER=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "COMPARE_URL=${{ github.event.compare }}" >> $GITHUB_OUTPUT
          
          # Generate formatted commit log
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            LOG=$(git log --oneline --no-decorate $COMMIT_RANGE | head -20)
            COMMIT_COUNT=$(git rev-list --count $COMMIT_RANGE)
            
            echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_OUTPUT
            
            if [ $COMMIT_COUNT -eq 1 ]; then
              COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
              echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
            else
              echo "COMMIT_MESSAGE=$COMMIT_COUNT commits" >> $GITHUB_OUTPUT
            fi
            
            # Format log for Telegram
            FORMATTED_LOG=$(echo "$LOG" | sed 's/^/- /' | head -10)
            echo "COMMIT_LOG<<EOF" >> $GITHUB_OUTPUT
            echo "$FORMATTED_LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "COMMIT_COUNT=1" >> $GITHUB_OUTPUT
            echo "COMMIT_MESSAGE=Initial commit" >> $GITHUB_OUTPUT
            echo "COMMIT_LOG<<EOF" >> $GITHUB_OUTPUT
            echo "- Initial repository setup" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Create message with HTML formatting
          MESSAGE="<b>🚀 New Push to ${{ steps.commit_log.outputs.REPO_NAME }}</b>

          👤 <b>Committer:</b> ${{ steps.commit_log.outputs.COMMITTER }}
          📂 <b>Branch:</b> ${{ steps.commit_log.outputs.BRANCH }}
          📝 <b>Commit:</b> ${{ steps.commit_log.outputs.COMMIT_MESSAGE }}
          
          <b>📋 Changes:</b>
          ${{ steps.commit_log.outputs.COMMIT_LOG }}

          🔗 <a href='${{ steps.commit_log.outputs.COMPARE_URL }}'>View Changes on GitHub</a>
          🌐 <a href='${{ steps.commit_log.outputs.REPO_URL }}'>Repository</a>"

          # Send to Telegram
          curl -s -X POST \
            -H 'Content-Type: application/json' \
            -d "{
              \"chat_id\": \"$CHAT_ID\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"HTML\",
              \"disable_web_page_preview\": false
            }" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
name: Telegram Exam Schedule & Commit Notification

on:
  push:
    branches:
      - main
  schedule:
    - cron: '13 4 * * *'

jobs:
  notify-exam-schedule-or-commit:
    runs-on: ubuntu-latest
    outputs:
      event_type: ${{ steps.determine_event.outputs.type }}

    steps:
      - name: Determine Event Type
        id: determine_event
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "type=commit" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "type=daily_update" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_TYPE: ${{ steps.determine_event.outputs.type }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/telegram_notify.py

        :root {
            --bg-base: #e8ecf1;
            --bg-pattern: #d4dae3;
            --container-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.45);
            --text-color: #2c3e50;
            --text-secondary: #5a6a7a;
            --header-bg: rgba(44, 62, 80, 0.80);
            --header-text: #ecf0f1;
            --table-header-bg: rgba(44, 62, 80, 0.07);
            --border-color: rgba(44, 62, 80, 0.10);
            --row-even: rgba(255, 255, 255, 0.18);
            --row-odd: rgba(255, 255, 255, 0.05);
            --hover-bg: rgba(52, 73, 94, 0.08);
            --accent-color: #e74c3c;
            --shadow: rgba(0, 0, 0, 0.10);
            --gap-bg: rgba(230, 126, 34, 0.08);
            --gap-text: #b94600;
            --success-color: #27ae60;
            --muted-color: #95a5a6;
            --tag-active-bg: rgba(44, 62, 80, 0.12);
            --tag-active-border: rgba(44, 62, 80, 0.35);
            --tag-hidden-bg: rgba(231, 76, 60, 0.07);
            --tag-hidden-border: rgba(231, 76, 60, 0.30);
            --tag-hidden-text: #c0392b;
        }

        [data-theme="dark"] {
            --bg-base: #0d0f14;
            --bg-pattern: #161820;
            --container-bg: rgba(22, 26, 35, 0.40);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-color: #dde3ec;
            --text-secondary: #7f90a4;
            --header-bg: rgba(20, 24, 32, 0.85);
            --header-text: #e8edf5;
            --table-header-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.07);
            --row-even: rgba(255, 255, 255, 0.03);
            --row-odd: rgba(0, 0, 0, 0.10);
            --hover-bg: rgba(255, 255, 255, 0.06);
            --accent-color: #ff8a80;
            --shadow: rgba(0, 0, 0, 0.45);
            --gap-bg: rgba(243, 156, 18, 0.10);
            --gap-text: #f0a500;
            --success-color: #6fcf97;
            --muted-color: #556070;
            --tag-active-bg: rgba(255, 255, 255, 0.07);
            --tag-active-border: rgba(255, 255, 255, 0.18);
            --tag-hidden-bg: rgba(255, 138, 128, 0.08);
            --tag-hidden-border: rgba(255, 138, 128, 0.25);
            --tag-hidden-text: #ff8a80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif;
            background-color: var(--bg-base);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23c8cfd8' stroke-width='1'%3E%3Cpath d='M15,15 L15,25 L25,25 L25,15 Z'/%3E%3Cpath d='M35,35 L35,45 L45,45 L45,35 Z'/%3E%3Ccircle cx='30' cy='10' r='3'/%3E%3Ccircle cx='50' cy='30' r='3'/%3E%3Cpath d='M5,50 Q10,45 15,50'/%3E%3Cpath d='M40,5 L45,10 L40,15'/%3E%3Cline x1='20' y1='40' x2='30' y2='50'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 60px 60px;
            color: var(--text-color);
            padding: 24px 16px 100px;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        [data-theme="dark"] body {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231c2030' stroke-width='1'%3E%3Cpath d='M15,15 L15,25 L25,25 L25,15 Z'/%3E%3Cpath d='M35,35 L35,45 L45,45 L45,35 Z'/%3E%3Ccircle cx='30' cy='10' r='3'/%3E%3Ccircle cx='50' cy='30' r='3'/%3E%3Cpath d='M5,50 Q10,45 15,50'/%3E%3Cpath d='M40,5 L45,10 L40,15'/%3E%3Cline x1='20' y1='40' x2='30' y2='50'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* ── Fixed controls ── */
        .controls-right {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .controls-left {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .tag-filter-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 12px;
            border: 1px solid var(--tag-active-border);
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 16px var(--shadow);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .tag-filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 22px var(--shadow);
        }

        .tag-filter-btn.tag-hidden {
            border-color: var(--tag-hidden-border);
            background: var(--tag-hidden-bg);
            color: var(--tag-hidden-text);
        }

        .tag-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success-color);
            transition: background 0.25s;
            flex-shrink: 0;
        }

        .tag-filter-btn.tag-hidden .tag-dot {
            background: var(--accent-color);
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            background: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px var(--shadow);
            width: 46px;
            height: 46px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover { transform: scale(1.05) translateY(-2px); }
        .theme-toggle:active { transform: scale(0.95); }

        .icon { width: 20px; height: 20px; fill: currentColor; transition: all 0.3s ease; }

        /* ── Container ── */
        .container {
            background: var(--container-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 18px;
            overflow: hidden;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            box-shadow: 0 8px 40px var(--shadow), 0 1px 0 var(--glass-border) inset;
            border: 1px solid var(--glass-border);
            transition: all 0.4s ease;
        }

        /* ── Header ── */
        .header {
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--header-text);
            padding: 22px 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header h1 {
            font-size: 1.45em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 5px;
        }

        .header h2 {
            font-size: 0.95em;
            font-weight: 400;
            opacity: 0.75;
        }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: var(--table-header-bg);
        }

        th {
            padding: 13px 12px;
            text-align: center;
            font-size: 0.82em;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            white-space: nowrap;
        }

        td {
            padding: 13px 12px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.92em;
            vertical-align: middle;
        }

        /* alternating rows */
        tbody tr:nth-child(even) { background: var(--row-even); }
        tbody tr:nth-child(odd)  { background: var(--row-odd); }

        tbody tr[data-type="exam"] {
            transition: background 0.2s ease, transform 0.2s ease;
        }

        tbody tr[data-type="exam"]:hover {
            background: var(--hover-bg) !important;
            transform: translateX(-2px);
        }

        tbody tr:last-child td { border-bottom: none; }

        /* ── Exam name column ── */
        .exam-name {
            text-align: right;
            padding-right: 18px;
            font-weight: 600;
            font-size: 0.94em;
            line-height: 1.45;
        }

        .exam-name-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .exam-tag-pill {
            display: inline-block;
            font-size: 0.68em;
            font-weight: 600;
            line-height: 1;
            padding: 3px 7px;
            border-radius: 5px;
            background: var(--tag-active-bg);
            border: 1px solid var(--tag-active-border);
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Days left ── */
        .days-left {
            font-weight: 700;
            font-size: 0.95em;
        }

        .days-left.future  { color: var(--accent-color); }
        .days-left.today   { color: var(--success-color); }
        .days-left.passed  { color: var(--muted-color); font-weight: 400; }

        /* ── Time column ── */
        .time {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            direction: ltr;
            unicode-bidi: embed;
        }

        /* ── Date column ── */
        .date-cell {
            font-weight: 500;
            white-space: nowrap;
        }

        /* ── Day column - hidden on very small screens ── */
        .col-day { white-space: nowrap; }

        /* ── Gap indicator ── */
        .gap-row td {
            padding: 7px 16px;
            font-size: 0.8em;
            font-weight: 600;
            font-style: italic;
            color: var(--gap-text);
            background: var(--gap-bg) !important;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .gap-row.gap-long td {
            --gap-bg: rgba(39, 174, 96, 0.08);
            --gap-text: #1e8449;
        }

        .gap-row.gap-short td {
            --gap-bg: rgba(192, 57, 43, 0.06);
            --gap-text: #a93226;
        }

        [data-theme="dark"] .gap-row.gap-long td {
            --gap-bg: rgba(111, 207, 151, 0.10);
            --gap-text: #6fcf97;
        }

        [data-theme="dark"] .gap-row.gap-short td {
            --gap-bg: rgba(255, 138, 128, 0.10);
            --gap-text: #ff8a80;
        }

        .gap-icon {
            width: 13px;
            height: 13px;
            vertical-align: -2px;
            margin-left: 5px;
            fill: currentColor;
            display: inline-block;
        }

        /* ── Loading / empty ── */
        .loading-cell {
            text-align: center;
            padding: 32px;
            color: var(--muted-color);
            font-size: 0.9em;
        }

        /* ── Footer ── */
        .footer-floating {
            position: fixed;
            bottom: 18px;
            right: 50%;
            transform: translateX(50%);
            padding: 11px 18px;
            border-radius: 14px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            background: var(--container-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--shadow);
            z-index: 999;
            font-size: 0.88em;
            white-space: nowrap;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .footer-floating:hover {
            transform: translateX(50%) translateY(-2px);
            box-shadow: 0 12px 40px var(--shadow);
        }

        .footer-link-floating {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-link-floating:hover { color: var(--accent-color); }

        .tg-icon {
            width: 20px;
            height: 20px;
            filter: invert(15%);
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .tg-icon { filter: invert(85%); }
        .footer-link-floating:hover .tg-icon { transform: scale(1.1) rotate(5deg); }

        /* ── Copyright ── */
        .copyright {
            text-align: center;
            margin-top: 18px;
            font-size: 0.78em;
            color: var(--muted-color);
            letter-spacing: 0.05em;
        }

        /* ── Animations ── */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        tbody tr[data-type="exam"] {
            animation: fadeSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            body { padding: 14px 12px 90px; }

            .header { padding: 18px 16px; }
            .header h1 { font-size: 1.2em; }
            .header h2 { font-size: 0.85em; }

            th, td { padding: 11px 8px; font-size: 0.87em; }
            .exam-name { padding-right: 12px; }

            .controls-right { top: 14px; right: 14px; }
            .controls-left  { top: 14px; left: 14px; }

            .theme-toggle { width: 42px; height: 42px; border-radius: 12px; }
            .tag-filter-btn { padding: 6px 11px; font-size: 0.78em; border-radius: 10px; }
        }

        @media (max-width: 520px) {
            .col-day { display: none; }

            th, td { padding: 10px 6px; font-size: 0.84em; }
            .exam-name { padding-right: 10px; font-size: 0.88em; }

            .footer-floating {
                bottom: 12px;
                padding: 9px 14px;
                font-size: 0.78em;
                border-radius: 11px;
                max-width: 90vw;
            }

            .tg-icon { width: 17px; height: 17px; }
        }

        @media (max-width: 380px) {
            th, td { padding: 9px 5px; font-size: 0.80em; }
        }
    </style>
</head>

    <script>
    // ── Persian number helper ──────────────────────────────────────────────
    const PD = '۰۱۲۳۴۵۶۷۸۹';
    function toPersian(str) {
        return String(str).replace(/[0-9]/g, d => PD[+d]);
    }

    // Replace all text-node digits in a subtree
    function persianizeTree(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            const updated = toPersian(node.nodeValue);
            if (updated !== node.nodeValue) node.nodeValue = updated;
        }
    }

    // ── Jalali → Gregorian ────────────────────────────────────────────────
    function jalaliToGregorian(jy, jm, jd) {
        let gy = jy <= 979 ? 621 : 1600;
        jy -= jy <= 979 ? 0 : 979;
        let days = (365 * jy) +
            (Math.floor(jy / 33) * 8) +
            Math.floor(((jy % 33) + 3) / 4) +
            78 + jd +
            (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);

        gy += 400 * Math.floor(days / 146097);
        days %= 146097;
        if (days > 36524) {
            gy += 100 * Math.floor(--days / 36524);
            days %= 36524;
            if (days >= 365) days++;
        }
        gy += 4 * Math.floor(days / 1461);
        days %= 1461;
        if (days > 365) {
            gy += Math.floor((days - 1) / 365);
            days = (days - 1) % 365;
        }
        let gd = days + 1;
        const leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
        const monthDays = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        let gm = 1;
        while (gm <= 12 && gd > monthDays[gm]) { gd -= monthDays[gm]; gm++; }
        // Return a UTC midnight date to avoid DST/timezone surprises
        return new Date(Date.UTC(gy, gm - 1, gd));
    }

    const WEEKDAYS = ['یک‌شنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
    const MONTHS   = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

    // ── CSV parser ────────────────────────────────────────────────────────
    // Splits a CSV line respecting double-quoted fields
    function splitCSVLine(line) {
        const result = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                if (inQuotes && line[i + 1] === '"') { field += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (ch === ',' && !inQuotes) {
                result.push(field.trim());
                field = '';
            } else {
                field += ch;
            }
        }
        result.push(field.trim());
        return result;
    }

    function parseCSV(csv) {
        const lines = csv.trim().split('\n').filter(l => l.trim() !== '');
        const headers = splitCSVLine(lines[0]);
        return lines.slice(1).map(line => {
            const values = splitCSVLine(line);
            const obj = {};
            headers.forEach((h, i) => { obj[h] = values[i] ?? ''; });
            return obj;
        });
    }

    // ── Tag parser ────────────────────────────────────────────────────────
    function parseTags(tagStr) {
        if (!tagStr || !tagStr.trim()) return [];
        return tagStr.split(',')
            .map(t => t.trim().replace(/^['"`]|['"`]$/g, '').trim())
            .filter(t => t.length > 0);
    }

    // ── State ─────────────────────────────────────────────────────────────
    let hiddenTags = new Set();

    // ── Load CSV ──────────────────────────────────────────────────────────
    async function loadExams() {
        const response = await fetch('data.csv');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const raw = await response.text();
        const rows = parseCSV(raw);

        return rows.map(row => {
            const parts = (row.date || '').split('-').map(p => parseInt(p, 10));
            let gregorianDate = null, dayName = '—', persianDate = '—';

            if (parts.length === 3 && parts.every(n => !isNaN(n))) {
                const [jy, jm, jd] = parts;
                gregorianDate = jalaliToGregorian(jy, jm, jd);
                // getUTCDay: 0=Sun … 6=Sat  → our WEEKDAYS array: 0=Sun
                dayName    = WEEKDAYS[gregorianDate.getUTCDay()];
                persianDate = `${toPersian(jd)} ${MONTHS[jm - 1]}`;
            }

            return {
                title: row.title || '',
                time:  row.time  || '',
                tags:  parseTags(row.tags || ''),
                gregorianDate,
                dayName,
                persianDate,
            };
        }).filter(e => e.gregorianDate !== null);
    }

    // ── Gap classification ────────────────────────────────────────────────
    function classifyGaps(exams) {
        const diffs = [];
        for (let i = 1; i < exams.length; i++) {
            const d = (exams[i].gregorianDate - exams[i-1].gregorianDate) / 86400000;
            if (d > 0) diffs.push(d);
        }
        if (diffs.length === 0) return { short: 0, long: Infinity };
        const sorted = [...diffs].sort((a, b) => a - b);
        const q = Math.max(1, Math.floor(sorted.length * 0.15));
        return { short: sorted[q - 1], long: sorted[sorted.length - q] };
    }

    // ── Render table ──────────────────────────────────────────────────────
    function renderTable(exams) {
        const tbody = document.getElementById('examTableBody');
        tbody.innerHTML = '';

        // UTC midnight for today
        const now = new Date();
        const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());

        const { short: shortThreshold, long: longThreshold } = classifyGaps(exams);
        // Store globally so createGapRow can use them
        gapShortThreshold = shortThreshold;
        gapLongThreshold  = longThreshold;

        let animDelay = 0;

        for (let i = 0; i < exams.length; i++) {
            const exam = exams[i];

            // Gap rows are NOT inserted here — applyTagFilter() builds them all

            // ── Exam row ──
            const examTs = exam.gregorianDate.getTime();
            const daysLeft = Math.round((examTs - todayUTC) / 86400000);

            let daysText, daysClass;
            if (daysLeft > 0)       { daysText = toPersian(daysLeft) + ' روز'; daysClass = 'days-left future'; }
            else if (daysLeft === 0) { daysText = 'امروز';                       daysClass = 'days-left today'; }
            else                    { daysText = 'گذشته';                        daysClass = 'days-left passed'; }

            const tagPillsHTML = exam.tags.length
                ? exam.tags.map(t => `<span class="exam-tag-pill">${t}</span>`).join('')
                : '';

            const tr = document.createElement('tr');
            tr.dataset.type      = 'exam';
            tr.dataset.index     = i;
            tr.dataset.tags      = JSON.stringify(exam.tags);
            tr.dataset.timestamp = exam.gregorianDate.getTime(); // for gap recalculation
            tr.style.animationDelay = `${animDelay}ms`;
            animDelay = Math.min(animDelay + 40, 400);

            tr.innerHTML = `
                <td class="exam-name"><div class="exam-name-wrap">${exam.title}${tagPillsHTML}</div></td>
                <td class="date-cell">${exam.persianDate}</td>
                <td class="time">${toPersian(exam.time)}</td>
                <td class="col-day">${exam.dayName}</td>
                <td><span class="${daysClass}">${daysText}</span></td>
            `;
            tbody.appendChild(tr);
        }

        applyTagFilter();
    }

    // Global gap thresholds (set once from all exams, used when re-rendering gaps)
    let gapShortThreshold = 0;
    let gapLongThreshold  = Infinity;

    // ── Build a single gap <tr> ───────────────────────────────────────────
    function createGapRow(days) {
        let cls = 'gap-row';
        if (days >= gapLongThreshold)       cls += ' gap-long';
        else if (days <= gapShortThreshold) cls += ' gap-short';

        const tr = document.createElement('tr');
        tr.dataset.type = 'gap';
        tr.className    = cls;
        tr.innerHTML = `<td colspan="5">
            <svg class="gap-icon" viewBox="0 0 24 24"><path d="M19,3H18V1H16V3H8V1H6V3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V8H19V19Z"/></svg>
            فاصله تا امتحان بعدی: ${toPersian(days)} روز
        </td>`;
        return tr;
    }

    // ── Tag filter ────────────────────────────────────────────────────────
    function applyTagFilter() {
        const tbody = document.getElementById('examTableBody');

        // 1. Remove ALL existing gap rows — we'll rebuild them
        tbody.querySelectorAll('tr[data-type="gap"]').forEach(r => r.remove());

        // 2. Show/hide exam rows based on tags
        const examRows = Array.from(tbody.querySelectorAll('tr[data-type="exam"]'));
        examRows.forEach(row => {
            const tags    = JSON.parse(row.dataset.tags || '[]');
            const hideRow = tags.some(t => hiddenTags.has(t));
            row.style.display = hideRow ? 'none' : '';
        });

        // 3. Reinsert gap rows between consecutive VISIBLE exam rows
        //    with freshly-calculated day differences
        const visibleRows = examRows.filter(r => r.style.display !== 'none');
        for (let i = 1; i < visibleRows.length; i++) {
            const prevTs = parseInt(visibleRows[i - 1].dataset.timestamp);
            const currTs = parseInt(visibleRows[i].dataset.timestamp);
            const days   = Math.round((currTs - prevTs) / 86400000);
            if (days > 0) {
                const gapTr = createGapRow(days);
                tbody.insertBefore(gapTr, visibleRows[i]);
            }
        }
    }

    // ── Build tag filter buttons ──────────────────────────────────────────
    function buildTagFilters(allTags) {
        const container   = document.getElementById('controlsLeft');
        // Remove existing tag buttons (keep the label)
        container.querySelectorAll('.tag-filter-btn').forEach(b => b.remove());

        allTags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-filter-btn';
            btn.dataset.tag = tag;
            btn.innerHTML = `<span class="tag-dot"></span>${tag}`;
            btn.addEventListener('click', () => {
                if (hiddenTags.has(tag)) hiddenTags.delete(tag);
                else                     hiddenTags.add(tag);
                updateTagButtons(allTags);
                applyTagFilter();
            });
            container.appendChild(btn);
        });

        updateTagButtons(allTags);
    }

    function updateTagButtons(allTags) {
        allTags.forEach(tag => {
            const btn = document.querySelector(`.tag-filter-btn[data-tag="${tag}"]`);
            if (!btn) return;
            if (hiddenTags.has(tag)) btn.classList.add('tag-hidden');
            else                     btn.classList.remove('tag-hidden');
        });
    }

    // ── Theme ─────────────────────────────────────────────────────────────
    function initTheme() {
        const stored = localStorage.getItem('theme');
        const theme  = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next    = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        const path = document.querySelector('#themeToggle .icon path');
        if (!path) return;
        path.setAttribute('d', theme === 'dark'
            ? 'M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8M12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z'
            : 'M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z'
        );
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        initTheme();
        try {
            const exams = await loadExams();

            // Collect unique tags in order of appearance
            const seenTags = [];
            exams.forEach(e => e.tags.forEach(t => { if (!seenTags.includes(t)) seenTags.push(t); }));

            buildTagFilters(seenTags);
            renderTable(exams);
            persianizeTree(document.body);
        } catch (err) {
            console.error(err);
            document.getElementById('examTableBody').innerHTML =
                `<tr><td colspan="5" class="loading-cell">خطا در بارگذاری اطلاعات امتحانات.</td></tr>`;
        }
    });
    </script>
</body>

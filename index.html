    <script>
        function toPersianNumbers(str) {
            const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
            const englishDigits = '0123456789';
            return str.toString().replace(/[0-9]/g, function (digit) {
                return persianDigits[englishDigits.indexOf(digit)];
            });
        }

        function parseGregorianDate(value) {
            const parts = value.split('-').map(p => p.trim());
            if (parts.length !== 3) {
                return new Date(value);
            }
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            return new Date(year, month - 1, day);
        }

        function toJalali(gy, gm, gd) {
            const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            gy -= (gy <= 1600) ? 621 : 1600;
            let gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
                + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * Math.floor(days / 12053);
            days %= 12053;
            jy += 4 * Math.floor(days / 1461);
            days %= 1461;
            if (days > 365) {
                jy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }
            const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
            const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return { jy, jm, jd };
        }

        function getPersianWeekday(date) {
            const names = ['یک‌شنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
            return names[date.getDay()];
        }

        function formatPersianDate(date) {
            const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
                'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
            const { jy, jm, jd } = toJalali(date.getFullYear(), date.getMonth() + 1, date.getDate());
            return `${toPersianNumbers(jd)} ${months[jm - 1]}`;
        }

        function replaceDigitsInTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            let node;
            while ((node = walker.nextNode())) {
                const updated = toPersianNumbers(node.nodeValue);
                if (updated !== node.nodeValue) {
                    node.nodeValue = updated;
                }
            }
        }

        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Function to parse CSV data into an array of objects
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Handle commas inside quotes
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                });
                result.push(obj);
            }
            return result;
        }

        // Function to fetch and process CSV data
        async function loadExamsFromCSV() {
            try {
                const response = await fetch('data.csv'); // Fetch the CSV file
                if (!response.ok) {
                    throw new Error(`Failed to load CSV: ${response.status}`);
                }
                const csvData = await response.text();
                const parsedExams = parseCSV(csvData);

                // Convert Gregorian dates to Date objects for calculations
                parsedExams.forEach(exam => {
                    exam.gregorianDate = parseGregorianDate(exam.date);
                    exam.day = getPersianWeekday(exam.gregorianDate);
                    exam.persianDate = formatPersianDate(exam.gregorianDate);
                });

                return parsedExams;
            } catch (error) {
                console.error("Error loading or parsing CSV:", error);
                document.getElementById('examTableBody').innerHTML = `<tr><td colspan="5">خطا در بارگذاری اطلاعات امتحانات.</td></tr>`;
                return []; // Return an empty array on failure
            }
        }


        async function populateExamTable() { // Make this function async
            const tableBody = document.getElementById('examTableBody');
            const today = new Date();

            // Clear any initial loading message if needed
            tableBody.innerHTML = '';

            const exams = await loadExamsFromCSV(); // Wait for exams to be loaded

            if (exams.length === 0) {
                return; // Exit if loading failed
            }

            const gaps = [];
            for (let i = 1; i < exams.length; i++) {
                const prevExamDate = exams[i - 1].gregorianDate; // Already a Date object
                const examDate = exams[i].gregorianDate;         // Already a Date object
                const daysBetween = Math.ceil((examDate - prevExamDate) / (1000 * 60 * 60 * 24));
                if (daysBetween > 0) {
                    gaps.push(daysBetween);
                }
            }
            gaps.sort((a, b) => a - b);

            const thresholdCount = Math.max(1, Math.floor(gaps.length * 0.25));
            const shortThreshold = gaps[thresholdCount - 1];
            const longThreshold = gaps[gaps.length - thresholdCount];

            for (let i = 0; i < exams.length; i++) {
                const exam = exams[i];
                const examDate = exam.gregorianDate; // Use the pre-converted Date object
                const timeDifference = examDate - today;
                const daysLeft = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));

                if (i > 0) {
                    const prevExamDate = exams[i - 1].gregorianDate; // Use the pre-converted Date object
                    const daysBetween = Math.ceil((examDate - prevExamDate) / (1000 * 60 * 60 * 24));

                    if (daysBetween > 0) {
                        let gapClass = 'gap-indicator';
                        if (daysBetween >= longThreshold) {
                            gapClass += ' gap-indicator-long';
                        } else if (daysBetween <= shortThreshold) {
                            gapClass += ' gap-indicator-short';
                        }

                        const gapRow = document.createElement('tr');
                        gapRow.innerHTML = `
                            <td colspan="5" class="${gapClass}">
                                <svg class="icon" style="width: 16px; height: 16px; vertical-align: middle; margin-left: 5px;" viewBox="0 0 24 24">
                                    <path fill="currentColor" d="M19,3H18V1H16V3H8V1H6V3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V8H19V19Z"/>
                                </svg>
                                فاصله تا امتحان بعدی: ${toPersianNumbers(daysBetween)} روز
                            </td>
                        `;
                        tableBody.appendChild(gapRow);
                    }
                }

                const row = document.createElement('tr');

                let daysLeftText = '';
                let daysLeftClass = 'days-left';

                if (daysLeft > 0) {
                    daysLeftText = toPersianNumbers(daysLeft) + ' روز';
                } else if (daysLeft === 0) {
                    daysLeftText = 'امروز';
                    daysLeftClass += ' today';
                } else {
                    daysLeftText = 'گذشته';
                    daysLeftClass += ' passed';
                }

                row.innerHTML = `
                    <td class="exam-name">${exam.title}</td>
                    <td>${toPersianNumbers(exam.persianDate)}</td>
                    <td class="time">${toPersianNumbers(exam.time)}</td>
                    <td>${exam.day}</td>
                    <td class="${daysLeft === 0 ? 'today' : daysLeft < 0 ? 'passed' : 'days-left'}">
                        ${daysLeftText}
                    </td>
                `;

                tableBody.appendChild(row);
            }
        }

        function initTheme() {
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const defaultTheme = systemDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', defaultTheme);
            updateThemeButton(defaultTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const button = document.getElementById('themeToggle');
            const icon = button.querySelector('.icon path');
            if (theme === 'dark') {
                icon.setAttribute('d', 'M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8M12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z');
            } else {
                icon.setAttribute('d', 'M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            initTheme();
            populateExamTable().then(() => {
                replaceDigitsInTextNodes(document.body);
            });
        });
    </script>
